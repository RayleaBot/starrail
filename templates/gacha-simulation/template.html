<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><style>{{ .Stylesheet }}</style></head>
<body>
  <div class="title">
    <img{{ with .icon }} data-render-resource="{{ . }}"{{ end }} alt="">结果展示<span class="user-name">{{ with .user }}{{ .nickname }}{{ end }}</span>
  </div>
  <div class="page-bkg">
    <img{{ with .background }} data-render-resource="{{ . }}"{{ end }} alt="">
    <div class="bkgLine">
      <img{{ with .line }} data-render-resource="{{ . }}"{{ end }} alt="">
    </div>
  </div>
  {{ range .rows }}
  <div class="{{ .class }}">
    {{ range .cards }}
    <div class="card card-{{ .rank }}{{ if .character }} withchar{{ end }}">
      <div class="bkg">
        <div class="bkgLinearColor"></div>
        <div class="stars"><img{{ with $.sparkle }} data-render-resource="{{ . }}"{{ end }} alt=""></div>
      </div>
      {{ with .count }}<div class="five-count">{{ . }}</div>{{ end }}
      <div class="char">
        {{ if .character }}
        <div class="bkg"></div>
        <div class="char-info">
          <div class="char-img"><img{{ with .image }} data-render-resource="{{ . }}"{{ end }} alt=""></div>
          <div class="char-detail">
            <div class="icon"><img{{ with .element }} data-render-resource="{{ . }}"{{ end }} alt=""></div>
            <div class="star">{{ range .stars }}<img{{ with $.star }} data-render-resource="{{ . }}"{{ end }} alt="">{{ end }}</div>
          </div>
        </div>
        {{ else }}
        <div class="weapon">
          <div class="type">
            <div class="icon"><img{{ with .path }} data-render-resource="{{ . }}"{{ end }} alt=""></div>
            <div class="star">{{ range .stars }}<img{{ with $.star }} data-render-resource="{{ . }}"{{ end }} alt="">{{ end }}</div>
          </div>
          <div class="image"><img{{ with .image }} data-render-resource="{{ . }}"{{ end }} alt=""></div>
        </div>
        {{ end }}
      </div>
    </div>
    {{ end }}
  </div>
  {{ end }}
  {{ with .render_footer }}<div class="copyright">{{ . }}</div>{{ end }}
</body>
</html>
